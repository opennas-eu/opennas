# OpenNAS reverse proxy - install to /etc/nginx/http.d/opennas.conf (Alpine).
# Forces HTTPS: port 80 redirects to 443; 443 serves the SPA and proxies /api
# (+ the /api/ws WebSocket) to the backend on 127.0.0.1:4174. The certificate is
# self-signed on first boot and can be replaced from the web UI
# (Control Panel -> Certificate), which rewrites these files and reloads nginx.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# HTTP -> HTTPS, except the ACME challenge.
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	# Let's Encrypt fetches this over plain HTTP on port 80. It must be served
	# here rather than redirected: the whole point of the request is that we do
	# not yet have a certificate anyone trusts.
	location /.well-known/acme-challenge/ {
		proxy_pass http://127.0.0.1:4174;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

# HTTPS
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	http2 on;
	server_name _;

	ssl_certificate     /etc/opennas/tls/cert.pem;
	ssl_certificate_key /etc/opennas/tls/key.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_session_cache   shared:SSL:2m;
	ssl_session_timeout 1h;

	root /usr/lib/opennas/web;
	index index.html;

	# Allow large file uploads through to /api/files/upload.
	client_max_body_size 0;

	# API + WebSocket -> backend.
	location /api/ {
		proxy_pass http://127.0.0.1:4174;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 1h;
		proxy_request_buffering off; # stream uploads instead of buffering to disk
	}

	# SPA client-side routing fallback.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
