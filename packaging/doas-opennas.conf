# OpenNAS doas policy - installed to /etc/doas.d/opennas.conf (mode 0600) by the
# installer and refreshed by opennas-update. This file is the only copy.
#
# The unprivileged opennas service may run exactly these helpers as root, each
# allow-listed by absolute path, and each re-validating its own arguments.
# There are deliberately no raw system tools: `adduser`, `smbpasswd`,
# `rc-service`, `smartctl` and friends used to be listed with any arguments,
# which let the service account set a Samba password for root, strip the real
# wheel group or stop sshd. reboot and poweroff stay as commands, but `args`
# with nothing after it means "no arguments at all".
permit nopass opennas as root cmd reboot args
permit nopass opennas as root cmd poweroff args
permit nopass opennas as root cmd /usr/lib/opennas/opennas-storage
permit nopass opennas as root cmd /usr/lib/opennas/opennas-sysctl
permit nopass opennas as root cmd /usr/lib/opennas/opennas-logs
permit nopass opennas as root cmd /usr/lib/opennas/opennas-firewall
permit nopass opennas as root cmd /usr/lib/opennas/opennas-update
permit nopass opennas as root cmd /usr/lib/opennas/opennas-zfs
